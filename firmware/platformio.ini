; AgriShield yer istasyonu — PlatformIO yapılandırması
; Derle ve yükle:  pio run -t upload   ·   Seri izleme:  pio device monitor
[platformio]
src_dir = agrishield-station

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  adafruit/Adafruit SHT31 Library@^2.2.2
